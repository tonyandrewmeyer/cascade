[project]
name = "pebble-cascade"
version = "1.0.0a7"
description = "A shell for debugging containers, particularly bare rocks, using Pebble"
readme = "README.md"
requires-python = ">=3.11"  # This should probably be 3.10, need to adjust shimmer as well.
license = {text = "MIT"}
authors = [
    {name = "Tony Meyer", email = "cascade@aotearoa.dev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ops>=2.0.0,<4",
    "rich>=13.7,<16.0",
    "pebble-shimmer",
    "typer~=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.16.0",
    "pyright>=1.1.0",
    "tox>=4.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/tonyandrewmeyer/cascade"
Repository = "https://github.com/tonyandrewmeyer/cascade"
Issues = "https://github.com/tonyandrewmeyer/cascade/issues"

[project.scripts]
cascade = "pebble_shell.shell:app"
pebble-cascade = "pebble_shell.shell:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pebble_shell"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/pebble_shell",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/pebble_shell"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if False:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "zizmor>=1.28.0",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "SIM117",
    "PERF403",
    "S101",
    "E501",
    "PLR0913",
    "PLR2004",
    # Mirrors the ops.pebble exception names.
    "A004",
    # Per-item try/except is deliberate: one bad line/protocol must not
    # abort the whole listing.
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806", "D"]
"scripts/*" = ["D", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
